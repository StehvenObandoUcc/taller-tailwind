<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gaming Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Poppins', sans-serif; }</style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 p-2 sm:p-4 lg:p-6 flex justify-center items-center">

  <div class="w-full max-w-[1360px] bg-white rounded-3xl shadow-xl p-3 sm:p-5 lg:p-6 flex flex-col md:flex-row gap-4 lg:gap-6">

    <!-- Nav -->
    <nav class="flex flex-row md:flex-col items-center justify-between border-b md:border-b-0 md:border-r border-gray-100 pb-3 md:pb-0 md:pr-4 md:w-14 shrink-0 gap-3">
      <div class="flex items-center md:flex-col gap-3 md:gap-4">
        <div class="hidden md:flex gap-1.5 mb-1"><span class="w-2.5 h-2.5 rounded-full bg-red-400"></span><span class="w-2.5 h-2.5 rounded-full bg-amber-400"></span><span class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span></div>
        <a href="#" class="text-orange-500 hover:scale-105 transition-transform" title="Dashboard"><svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="6" y1="12" x2="10" y2="12"/><line x1="8" y1="10" x2="8" y2="14"/><line x1="15" y1="13" x2="15.01" y2="13"/><line x1="18" y1="11" x2="18.01" y2="11"/><rect x="2" y="6" width="20" height="12" rx="6"/></svg></a>
      </div>
      <div class="flex flex-row md:flex-col items-center gap-1.5 sm:gap-3">
        <a href="#" class="bg-orange-100 text-orange-500 p-2 sm:p-2.5 rounded-2xl" title="Home"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM9 22V12h6v10"/></svg></a>
        <a href="#" class="text-gray-400 hover:text-orange-500 p-2 sm:p-2.5 transition-colors" title="Library"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect width="20" height="15" x="2" y="7" rx="2"/><path stroke-linecap="round" stroke-linejoin="round" d="m17 2-5 5-5-5"/></svg></a>
        <a href="#" class="text-gray-400 hover:text-orange-500 p-2 sm:p-2.5 transition-colors" title="Messages"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></a>
        <a href="#" class="text-gray-400 hover:text-orange-500 p-2 sm:p-2.5 transition-colors" title="Favorites"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></a>
        <a href="#" class="text-gray-400 hover:text-orange-500 p-2 sm:p-2.5 transition-colors" title="Community"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8m13 10v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg></a>
      </div>
      <div class="flex items-center md:flex-col gap-2 md:gap-3 md:mt-auto">
        <a href="#" class="text-gray-400 hover:text-gray-700 p-2 transition-colors" title="Settings"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path stroke-linecap="round" stroke-linejoin="round" d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1 2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></a>
        <a href="#" class="text-gray-400 hover:text-red-500 p-2 transition-colors" title="Logout"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4m7 14 5-5-5-5m5 5H9"/></svg></a>
      </div>
    </nav>

    <div class="flex-1 min-w-0">
      <div class="p-6 text-gray-400 text-sm">Dashboard content in progress...</div>
    </div>

  </div>

</body>
</html>
